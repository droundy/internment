[package]
name = "internment"
version = "0.8.6"
authors = ["David Roundy <daveroundy@gmail.com>"]
edition = "2018"

description = "Easy interning of data"
license = "MIT OR Apache-2.0"
repository = "https://github.com/droundy/internment"

readme = "README.md"
categories = ["caching", "memory-management", "concurrency"]
keywords = ["hash", "interning", "hashconsing", "caching", "interner"]
rust-version = "1.71"

# Ensures dev-dependencies to enable features on standard dependencies unless compiling examples,
# tests, etc.
resolver = "2"

[badges]

appveyor = { repository = "droundy/internment" }
travis-ci = { repository = "droundy/internment" }
coveralls = { repository = "droundy/internment" }

is-it-maintained-issue-resolution = { repository = "droundy/internment" }
is-it-maintained-open-issues = { repository = "droundy/internment" }
maintenance = { status = "actively-developed" }

[dependencies]

ahash = { version = "0.8.5", optional = true }
dashmap = { version = "5.4.0", optional = true }
once_cell = { version = "1.4", optional = true }
tinyset = { version = "0.5.2", optional =  true }
memorable-wordlist = { version = "0.1.7", optional = true }
# Only for the get_container benchmark (see the `benchmarks` feature).
criterion = { version = "0.4", features = ["html_reports"], optional = true }
hashbrown = { version = "0.15.0" }
serde = { version = "1.0", optional = true, default-features = false }
deepsize = { version = "0.2.0", optional = true, default-features = false }

arc-interner = { version = "0.7", optional = true }

append-only-vec = { version = "0.1.9", default-features = false, optional = true }

spin = { version = "0.9.8", default-features = false, optional = true, features = [
  "spin_mutex",
] }
portable-atomic = { version = "1", default-features = false, optional = true }

[features]

arc = ["std", "dep:ahash", "dep:dashmap", "dep:once_cell"]
bench = ["arc", "arena", "_experimental-new-intern", "dep:memorable-wordlist"]
# Everything the benchmarks in `benches/` need.  Not part of the public API.
benchmarks = ["bench", "dep:criterion"]
arena = ["alloc"]
intern = ["alloc", "dep:append-only-vec"]
intern32 = ["alloc", "dep:append-only-vec"]
default = ["intern", "std"]
_experimental-new-intern = ["alloc", "dep:append-only-vec"]
std = ["alloc", "append-only-vec?/std"]
alloc = ["serde?/alloc"]
tinyset = ["std", "dep:tinyset"]
portable-atomic = [
    "dep:portable-atomic",
    "spin?/portable_atomic",
    "append-only-vec?/portable-atomic",
]
critical-section = ["portable-atomic?/critical-section"]

[dev-dependencies]
scaling = "0.1.3"
rand = "0.9"
serde_json = "1.0.87"

# [profile.release]
# debug = true

# docs.rs-specific configuration
[package.metadata.docs.rs]
# Document every feature except `benchmarks`, which only adds the benchmarks'
# dependencies, some of which do not build with docs.rs's nightly.
features = ["arc", "arena", "intern", "intern32", "std", "tinyset", "serde", "deepsize", "spin", "portable-atomic", "critical-section", "bench"]
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "get_container"
harness = false
required-features = ["benchmarks"]
